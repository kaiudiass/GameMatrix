002107", "inverse-surface": "#dfe4e0", "on-tertiary-fixed-variant": "#095300", "tertiary-fixed-dim": "#2ae500", "surface-variant": "#313633", "primary-fixed": "#6bff83", "outline": "#849581", "on-primary": "#003911", "on-secondary": "#003912", "on-secondary-fixed": "#002108", "on-background": "#dfe4e0", "surface-container-lowest": "#0a0f0d", "on-error": "#690005", "secondary-container": "#2da54c", "primary": "#edffe8" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "0.75rem", "space-xl": "2rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "margin": "1.25rem", "gutter-mobile": "0.5rem", "space-md": "0.75rem", "margin-mobile": "1rem", "space-lg": "1.25rem" }, "fontFamily": { "headline-xl": ["JetBrains Mono"], "label-sm": ["JetBrains Mono"], "headline-xl-mobile": ["JetBrains Mono"], "body-lg": ["JetBrains Mono"], "body-md": ["JetBrains Mono"], "headline-md": ["JetBrains Mono"], "headline-lg": ["JetBrains Mono"], "title-md": ["JetBrains Mono"], "label-lg": ["JetBrains Mono"] }, "fontSize": { "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.04em", "fontWeight": "700" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.12em", "fontWeight": "500" }], "headline-xl-mobile": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "body-lg": ["15px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "body-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "500" }], "label-lg": ["12px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen relative selection:bg-primary-container selection:text-on-primary-container"><div class="fixed inset-0 crt-overlay z-40 pointer-events-none"></div><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.4)] border-b border-outline-variant"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs font-mono tracking-wider"><span class="text-primary-container text-[18px] font-bold select-none">[</span><span class="font-title-md text-title-md font-bold text-primary-container tracking-wider">vovómatrix</span><span class="text-primary-container text-[18px] font-bold select-none">]</span><span class="inline-block w-2 h-4 bg-primary-container animate-crt-pulse ml-0.5"></span></div><button type="button" class="w-8 h-8 rounded-full bg-surface-container-highest border border-primary-container flex items-center justify-center text-primary-container hover:bg-primary-container hover:text-surface transition-colors select-none group" aria-label="Perfil"><span class="material-symbols-outlined text-[18px]">person</span></button></div></header><main class="flex flex-col relative w-full pt-14 pb-20 bg-surface min-h-screen"><div class="flex flex-col w-full max-w-[420px] mx-auto px-margin-mobile py-space-sm space-y-space-md select-none">
<!-- Telemetria Superior da Sala -->
<div class="w-full bg-surface-container-low p-space-sm rounded">
<div class="flex items-center justify-between font-label-sm text-label-sm text-on-surface-variant tracking-wider">
<span class="">ROOM_ID: #0x9F4</span>

</div>
<!-- Duelo de Jogadores -->
<div class="mt-space-xs flex items-center justify-between text-on-surface font-title-md text-title-md">
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 bg-primary-container"></span>
<span class="text-primary-container font-headline-md text-headline-md tracking-tight font-bold">VOCÊ (X)</span>
</div>
<span class="text-on-surface-variant font-label-lg text-label-lg font-mono">VS</span>
<div class="flex items-center gap-1.5">
<span class="text-secondary font-headline-md text-headline-md tracking-tight font-bold">ENIO (O)</span>
<span class="w-2 h-2 bg-secondary"></span>
</div>
</div>
</div>
<!-- Indicador de Turno Ativo -->
<div class="w-full bg-surface-container px-space-md py-space-sm rounded flex items-center shadow-[0_0_12px_rgba(0,255,102,0.15)] justify-center">
<div class="flex items-center gap-2">
<span class="text-primary-container font-headline-md text-headline-md font-bold tracking-wider flex items-center gap-1" id="turn-indicator">
        &gt; SEU TURNO [X]
        <span class="w-2.5 h-4 bg-primary-container inline-block animate-crt-pulse"></span>
</span>
</div>

</div>
<!-- Tabuleiro 3x3 Matriz Principal -->
<div class="relative w-full aspect-square max-w-[340px] mx-auto p-1 bg-surface-container-highest rounded">
<!-- Grid 3x3 Minimalista -->
<div class="grid grid-cols-3 grid-rows-3 gap-1 w-full h-full bg-surface" id="board">
<!-- Célula 0 -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-primary-container active:bg-primary-container active:text-on-primary-container focus:outline-none" data-index="0">
<span class="">X</span>
</button>
<!-- Célula 1 -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-secondary active:bg-secondary active:text-on-secondary focus:outline-none" data-index="1">
<span class="">O</span>
</button>
<!-- Célula 2 -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-primary-container active:bg-primary-container active:text-on-primary-container focus:outline-none" data-index="2">
<span></span>
</button>
<!-- Célula 3 -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-secondary active:bg-secondary active:text-on-secondary focus:outline-none" data-index="3">
<span class="">O</span>
</button>
<!-- Célula 4 (Centro) -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-primary-container active:bg-primary-container active:text-on-primary-container focus:outline-none" data-index="4">
<span class="">X</span>
</button>
<!-- Célula 5 -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-primary-container active:bg-primary-container active:text-on-primary-container focus:outline-none" data-index="5">
<span></span>
</button>
<!-- Célula 6 -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-primary-container active:bg-primary-container active:text-on-primary-container focus:outline-none" data-index="6">
<span></span>
</button>
<!-- Célula 7 -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-secondary active:bg-secondary active:text-on-secondary focus:outline-none" data-index="7">
<span></span>
</button>
<!-- Célula 8 -->
<button class="board-cell bg-surface-container-low hover:bg-surface-container transition-colors flex items-center justify-center font-headline-xl text-headline-xl text-primary-container active:bg-primary-container active:text-on-primary-container focus:outline-none" data-index="8">
<span></span>
</button>
</div>
</div>
<!-- Telemetria Rápida / Log de Movimentos -->
<div class="w-full bg-surface-container-low px-space-sm py-space-xs rounded flex items-center justify-between font-label-sm text-label-sm text-on-surface-variant font-mono">

<span class="">ROUND: 05/09</span>
<span class="text-primary-container">FPS: 60.0</span>
</div>
<!-- Ação Inferior / Abandono com Confirmação Rápida -->
<div class="w-full pt-space-xs">
<!-- Estado Padrão -->
<div class="w-full" id="abandon-default">
<button class="w-full py-space-sm bg-surface-container text-error hover:bg-surface-container-high transition-colors font-label-lg text-label-lg tracking-widest text-center flex items-center justify-center gap-1.5 active:bg-error-container active:text-on-error-container rounded" id="btn-abandon-trigger">
<span class="material-symbols-outlined text-[16px]">flag</span>
        [ ABANDONAR JOGO ]
      </button>
</div>
<!-- Estado Confirmação Rápida (Oculto dinamicamente) -->
<div class="hidden w-full flex-col gap-1.5 p-space-sm bg-surface-container-high rounded animate-pulse" id="abandon-confirm">
<div class="text-center font-label-sm text-label-sm text-error font-mono">
        &gt; CONFIRMA RENDIÇÃO? DERROTA IMEDIATA.
      </div>
<div class="flex items-center gap-2">
<button class="flex-1 py-1 bg-error-container text-on-error-container font-label-lg text-label-lg tracking-wider text-center active:opacity-80 rounded" id="btn-abandon-yes">
          [ SIM, SAIR ]
        </button>
<button class="flex-1 py-1 bg-surface-container text-on-surface font-label-lg text-label-lg tracking-wider text-center active:bg-surface-bright rounded" id="btn-abandon-no">
          [ CANCELAR ]
        </button>
</div>
</div>
</div>
</div>
<script>
  (function() {
    // Interatividade da Matriz 3x3
    const cells = document.querySelectorAll('.board-cell');
    let currentTurn = 'X';
    const turnIndicator = document.getElementById('turn-indicator');

    cells.forEach((cell) => {
      cell.addEventListener('click', () => {
        const span = cell.querySelector('span');
        if (!span || span.innerText.trim() !== '') return;

        span.innerText = currentTurn;
        if (currentTurn === 'X') {
          cell.classList.remove('text-secondary');
          cell.classList.add('text-primary-container');
          currentTurn = 'O';
          if (turnIndicator) {
            turnIndicator.innerHTML = '&gt; AGUARDANDO [O]<span class="w-2.5 h-4 bg-secondary inline-block animate-crt-pulse"></span>';
            turnIndicator.classList.remove('text-primary-container');
            turnIndicator.classList.add('text-secondary');
          }
        } else {
          cell.classList.remove('text-primary-container');
          cell.classList.add('text-secondary');
          currentTurn = 'X';
          if (turnIndicator) {
            turnIndicator.innerHTML = '&gt; SEU TURNO [X]<span class="w-2.5 h-4 bg-primary-container inline-block animate-crt-pulse"></span>';
            turnIndicator.classList.remove('text-secondary');
            turnIndicator.classList.add('text-primary-container');
          }
        }
      });
    });

    // Fluxo do Botão de Rendição
    const trigger = document.getElementById('btn-abandon-trigger');
    const defaultBox = document.getElementById('abandon-default');
    const confirmBox = document.getElementById('abandon-confirm');
    const btnCancel = document.getElementById('btn-abandon-no');
    const btnConfirm = document.getElementById('btn-abandon-yes');

    if (trigger && confirmBox && defaultBox) {
      trigger.addEventListener('click', () => {
        defaultBox.classList.add('hidden');
        confirmBox.classList.remove('hidden');
        confirmBox.classList.add('flex');
      });

      btnCancel.addEventListener('click', () => {
        confirmBox.classList.add('hidden');
        confirmBox.classList.remove('flex');
        defaultBox.classList.remove('hidden');
      });

      btnConfirm.addEventListener('click', () => {
        if (turnIndicator) {
          turnIndicator.innerHTML = '&gt; PARTIDA ENCERRADA [DERROTA]';
          turnIndicator.classList.remove('text-primary-container', 'text-secondary');
          turnIndicator.classList.add('text-error');
        }
        confirmBox.innerHTML = '<div class="text-center w-full py-1 text-error font-label-sm text-label-sm font-mono">[!] SESSÃO ABANDONADA</div>';
      });
    }

    // Cronômetro simples do Turno
    let seconds = 14;
    const timerEl = document.getElementById('match-timer');
    setInterval(() => {
      if (seconds > 0) {
        seconds--;
        if (timerEl) {
          timerEl.innerText = '00:' + (seconds < 10 ? '0' : '') + seconds;
        }
      }
    }, 1000);
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.5)]" data-active-classes="text-primary-container bg-surface-container"><div class="flex justify-around items-center h-16 px-gutter-mobile"><a class="flex flex-col items-center justify-center min-w-[72px] h-11 text-on-surface-variant hover:text-primary-container transition-colors" data-path="lobby" href="#"><span class="material-symbols-outlined text-[20px]">hub</span><span class="font-label-sm text-label-sm tracking-widest mt-0.5">[LOBBY]</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[72px] h-11 transition-colors text-primary-container bg-surface-container" data-path="game" href="#"><span class="material-symbols-outlined text-[20px]">grid_3x3</span><span class="font-label-sm text-label-sm tracking-widest mt-0.5">[GAME]</span></a></div></nav>
