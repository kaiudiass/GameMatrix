<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0f1412;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.crt-overlay{background:linear-gradient(rgba(15,20,18,0) 50%,rgba(0,0,0,0.35) 50%),linear-gradient(90deg,rgba(0,255,102,0.015),rgba(0,0,0,0.01),rgba(0,255,102,0.015));background-size:100% 2px,3px 100%;pointer-events:none;}@keyframes crt-pulse{0%,100%{opacity:1;}50%{opacity:0.2;}}.animate-crt-pulse{animation:crt-pulse 1.2s infinite step-start;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-highest": "#313633", "on-primary-container": "#007128", "on-secondary-fixed-variant": "#00531e", "surface-container-high": "#262b29", "error-container": "#93000a", "outline-variant": "#3b4b3a", "surface-container": "#1c211e", "inverse-on-surface": "#2c322f", "on-tertiary": "#053900", "on-tertiary-container": "#107100", "surface-bright": "#353a38", "secondary-fixed-dim": "#6ade7d", "error": "#ffb4ab", "on-surface-variant": "#b9ccb5", "on-tertiary-fixed": "#022100", "secondary-fixed": "#86fb96", "secondary": "#6ade7d", "tertiary-fixed": "#79ff5b", "tertiary-container": "#3aff16", "inverse-primary": "#006e27", "primary-fixed-dim": "#00e55b", "on-secondary-container": "#00320f", "primary-container": "#00ff66", "on-surface": "#dfe4e0", "on-error-container": "#ffdad6", "background": "#0f1412", "tertiary": "#efffe3", "surface-tint": "#00e55b", "surface-dim": "#0f1412", "surface-container-low": "#181d1b", "on-primary-fixed-variant": "#00531b", "surface": "#0f1412", "on-primary-fixed": "#   </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen relative selection:bg-primary-container selection:text-on-primary-container"><div class="fixed inset-0 crt-overlay z-40 pointer-events-none"></div><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.4)]"></header><main class="flex flex-col relative w-full pt-14 pb-20 bg-surface min-h-screen justify-center"><div class="flex flex-col w-full max-w-[420px] mx-auto px-margin-mobile py-space-md select-none">
<!-- Minimalist Mainframe Status Log -->
<div class="flex items-center justify-between font-label-sm text-label-sm text-on-surface-variant mb-space-md opacity-80">


</div>
<!-- Terminal Box Architecture -->
<div class="bg-surface-container-low shadow-[0_0_15px_rgba(0,255,102,0.06)] p-space-md relative overflow-hidden flex flex-col gap-space-lg">
<!-- ASCII Console Header -->
<div class="flex flex-col gap-1">

<div class="flex items-center justify-between px-space-xs">
<h1 class="text-primary-container font-title-md text-title-md tracking-wider flex items-center gap-1.5">
<span class="text-secondary-fixed">SYS_LOGIN</span>
<span class="opacity-40">//</span>
<span class="text-on-surface">ACESSO</span>
</h1>
<span class="material-symbols-outlined text-primary-container text-[18px] animate-pulse">lock</span>
</div>

</div>
<!-- Retro Switcher Tabs -->
<div class="grid grid-cols-2 gap-space-xs p-1 bg-surface-container-lowest">
<button class="h-9 flex items-center justify-center font-label-lg text-label-lg tracking-widest bg-primary-container text-on-primary-container shadow-[0_0_8px_rgba(0,255,102,0.35)] transition-all" id="tab-login" onclick="switchAuthMode('login')">
        [ LOGIN ]
      </button>
<button class="h-9 flex items-center justify-center font-label-lg text-label-lg tracking-widest text-on-surface-variant hover:text-primary-container transition-all" id="tab-register" onclick="switchAuthMode('register')">
        [ REGISTRO ]
      </button>
</div>
<!-- Terminal Prompt Form -->
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Input: USERNAME -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-primary-container tracking-widest flex items-center gap-1" for="username-input">
<span class="">&gt; USERNAME</span>
<span class="w-1.5 h-3 bg-primary-container inline-block animate-crt-pulse"></span>
</label>
<div class="relative bg-surface-container-lowest flex items-center px-space-sm h-11 focus-within:shadow-[0_0_8px_rgba(0,255,102,0.25)]">
<input autocomplete="off" class="w-full bg-transparent text-primary-container placeholder:text-outline-variant font-body-md text-body-md focus:outline-none tracking-wider uppercase caret-primary-container" id="username-input" placeholder="OPERADOR_ID" required="" type="text">
</div>
</div>
<!-- Input: PASSWORD -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-primary-container tracking-widest flex items-center gap-1" for="password-input">
<span class="">&gt; PASSWORD</span>
<span class="w-1.5 h-3 bg-primary-container inline-block opacity-40"></span>
</label>
<div class="relative bg-surface-container-lowest flex items-center px-space-sm h-11 focus-within:shadow-[0_0_8px_rgba(0,255,102,0.25)]">
<input class="w-full bg-transparent text-primary-container placeholder:text-outline-variant font-body-md text-body-md focus:outline-none tracking-widest caret-primary-container" id="password-input" placeholder="••••••••" required="" type="password">
<button class="text-on-surface-variant hover:text-primary-container focus:outline-none p-1" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="pwd-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Input: CONFIRM PASSWORD (hidden by default) -->
<div class="hidden flex flex-col gap-1.5" id="confirm-pwd-group">
<label class="font-label-sm text-label-sm text-primary-container tracking-widest flex items-center gap-1" for="confirm-password-input">
<span class="">&gt; CONFIRMAR_SENHA</span>
<span class="w-1.5 h-3 bg-primary-container inline-block opacity-40"></span>
</label>
<div class="relative bg-surface-container-lowest flex items-center px-space-sm h-11 focus-within:shadow-[0_0_8px_rgba(0,255,102,0.25)]">
<input class="w-full bg-transparent text-primary-container placeholder:text-outline-variant font-body-md text-body-md focus:outline-none tracking-widest caret-primary-container" id="confirm-password-input" placeholder="••••••••" type="password">
</div>
</div>
<!-- Action Button -->
<button class="mt-space-xs h-12 w-full bg-surface-container hover:bg-primary-container text-primary-container hover:text-on-primary-container font-label-lg text-label-lg tracking-widest flex items-center justify-center gap-space-xs shadow-[0_0_10px_rgba(0,255,102,0.15)] active:scale-[0.99] transition-all cursor-pointer" id="submit-btn" type="submit">
<span id="submit-text" class="">&gt; [ ENTRAR ]</span>

</button>
</form>
<!-- Visual Divider -->

<!-- Quick Guest Access / Bypasser -->
<div class="flex flex-col gap-2">

</div>
<!-- Dynamic Terminal Feedback Message -->

</div>
<!-- Discrete Footer Telemetry -->

</div>
<script>
  let currentAuthMode = 'login';

  function switchAuthMode(mode) {
    currentAuthMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const confirmPwdGroup = document.getElementById('confirm-pwd-group');
    const confirmPwdInput = document.getElementById('confirm-password-input');
    const submitText = document.getElementById('submit-text');
    const feedback = document.getElementById('console-feedback');

    if (mode === 'login') {
      tabLogin.className = 'h-9 flex items-center justify-center font-label-lg text-label-lg tracking-widest bg-primary-container text-on-primary-container shadow-[0_0_8px_rgba(0,255,102,0.35)] transition-all';
      tabRegister.className = 'h-9 flex items-center justify-center font-label-lg text-label-lg tracking-widest text-on-surface-variant hover:text-primary-container transition-all';
      confirmPwdGroup.classList.add('hidden');
      confirmPwdInput.removeAttribute('required');
      submitText.textContent = '> [ ENTRAR ]';
      feedback.textContent = '// MODO: VALIDAÇÃO DE CREDENCIAIS';
      feedback.className = 'min-h-5 flex items-center justify-center text-center font-label-sm text-label-sm text-secondary-fixed tracking-wider';
    } else {
      tabRegister.className = 'h-9 flex items-center justify-center font-label-lg text-label-lg tracking-widest bg-primary-container text-on-primary-container shadow-[0_0_8px_rgba(0,255,102,0.35)] transition-all';
      tabLogin.className = 'h-9 flex items-center justify-center font-label-lg text-label-lg tracking-widest text-on-surface-variant hover:text-primary-container transition-all';
      confirmPwdGroup.classList.remove('hidden');
      confirmPwdInput.setAttribute('required', 'true');
      submitText.textContent = '> [ CRIAR CONTA ]';
      feedback.textContent = '// MODO: NOVO REGISTRO DE USUÁRIO';
      feedback.className = 'min-h-5 flex items-center justify-center text-center font-label-sm text-label-sm text-tertiary-fixed tracking-wider';
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('pwd-eye-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function triggerAuth() {
    const feedback = document.getElementById('console-feedback');
    const user = document.getElementById('username-input').value.trim();
    feedback.textContent = '// PROCESSANDO TRANSMISSÃO...';
    feedback.className = 'min-h-5 flex items-center justify-center text-center font-label-sm text-label-sm text-primary-container tracking-wider animate-pulse';

    setTimeout(() => {
      if (currentAuthMode === 'login') {
        feedback.textContent = `// BEM-VINDO DE VOLTA, ${user || 'OPERADOR'} [ACESSO CONCEDIDO]`;
        feedback.className = 'min-h-5 flex items-center justify-center text-center font-label-sm text-label-sm text-primary-container tracking-wider font-semibold';
      } else {
        feedback.textContent = '// REGISTRO CONCLUÍDO COM SUCESSO [ONLINE]';
        feedback.className = 'min-h-5 flex items-center justify-center text-center font-label-sm text-label-sm text-secondary-fixed tracking-wider font-semibold';
      }
    }, 800);
  }

  function guestLogin() {
    const feedback = document.getElementById('console-feedback');
    const userInput = document.getElementById('username-input');
    const guestId = 'CONVIDADO_' + Math.floor(1000 + Math.random() * 9000);
    userInput.value = guestId;
    feedback.textContent = `// SESSÃO TEMPORÁRIA: ${guestId}`;
    feedback.className = 'min-h-5 flex items-center justify-center text-center font-label-sm text-label-sm text-secondary-fixed-dim tracking-wider';
  }
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.5)]" data-active-classes="text-primary-container bg-surface-container"></nav>

</body></html>
